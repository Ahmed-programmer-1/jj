<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة حكيم التعليمية</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e5202c">
<script>(function(){try{if(localStorage.getItem('hakim_theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
<style>
/* ============================================================
   منصة حكيم التعليمية — نظام التصميم (نسخة موسّعة)
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap');

:root {
  --bg: #0c0c0d;
  --surface: #161616;
  --surface-2: #1c1c1e;
  --line: #2a2a2c;
  --text: #f2f2f2;
  --text-muted: #9a9a9d;

  --red: #e5202c;
  --red-dim: #a3141c;
  --red-glow: rgba(229,32,44,0.35);

  --green: #2fb85f;
  --amber: #e8a33d;

  --font-display: 'Tajawal', sans-serif;
  --font-body: 'IBM Plex Sans Arabic', sans-serif;

  --radius-card: 10px;
  --radius-sm: 8px;

  --shadow-lift: 0 16px 32px rgba(0,0,0,0.55);
}

html[data-theme="light"] {
  --bg: #f4f4f5;
  --surface: #ffffff;
  --surface-2: #f0f0f1;
  --line: #e2e2e4;
  --text: #17171a;
  --text-muted: #6b6b70;
  --shadow-lift: 0 16px 32px rgba(0,0,0,0.12);
}

* { box-sizing: border-box; }
html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }

body {
  margin: 0;
  background: var(--bg);
  background-image: radial-gradient(circle at 15% 0%, rgba(229,32,44,0.09), transparent 45%);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  transition: background 0.2s ease, color 0.2s ease;
}

a { color: inherit; text-decoration: none; }
::selection { background: var(--red); color: #fff; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; border-radius: 4px; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 0 22px; }

/* ---------- الرأس ---------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(12,12,13,0.9);
  backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--red-dim);
}
html[data-theme="light"] .site-header { background: rgba(255,255,255,0.85); }

.site-header-inner { display: flex; align-items: center; gap: 14px; padding: 14px 22px; }
.brand { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }

.brand-mark { width: 44px; height: 44px; flex-shrink: 0; filter: drop-shadow(0 0 6px rgba(229,32,44,0.55)); animation: logo-pulse 3.2s ease-in-out infinite; }
@keyframes logo-pulse {
  0%, 100% { filter: drop-shadow(0 0 5px rgba(229,32,44,0.45)); }
  50% { filter: drop-shadow(0 0 14px rgba(229,32,44,0.85)); }
}

.brand-text h1 { font-family: var(--font-display); font-weight: 900; font-size: 1.4rem; margin: 0; letter-spacing: 0.3px; }
.brand-text h1 span { color: var(--red); }
.brand-text p { margin: 0; font-size: 0.74rem; color: var(--text-muted); }

.header-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-muted); transition: all 0.15s ease; flex-shrink: 0;
}
.icon-btn:hover { color: var(--red); border-color: var(--red-dim); }
.icon-btn svg { width: 18px; height: 18px; fill: currentColor; }
.icon-btn .sun { display: none; }
html[data-theme="light"] .icon-btn .moon { display: none; }
html[data-theme="light"] .icon-btn .sun { display: block; }

/* ---------- شريط البحث والتصنيف ---------- */
.control-panel { padding: 26px 0 10px; }
.search-row { position: relative; }
.search-row input {
  width: 100%; background: var(--surface); border: 1px solid var(--line); color: var(--text);
  font-family: var(--font-body); font-size: 0.95rem; padding: 13px 46px 13px 16px;
  border-radius: var(--radius-sm); transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.search-row input::placeholder { color: var(--text-muted); }
.search-row input:focus { border-color: var(--red); outline: none; box-shadow: 0 0 0 3px var(--red-glow); }
.search-row svg { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; fill: none; stroke: var(--text-muted); stroke-width: 2; pointer-events: none; }

.tab-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.tab-btn {
  background: var(--surface); border: 1px solid var(--line); color: var(--text-muted);
  font-family: var(--font-body); font-weight: 500; font-size: 0.82rem; padding: 8px 18px;
  border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s ease;
}
.tab-btn:hover { color: var(--text); border-color: var(--red-dim); }
.tab-btn.active { background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; }

/* ---------- شبكة الكروت ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 20px; padding: 22px 0 60px; }
.course-card { position: relative; display: block; cursor: pointer; opacity: 0; transform: translateY(10px); animation: card-in 0.45s ease forwards; }
@keyframes card-in { to { opacity: 1; transform: translateY(0); } }

.card-media { position: relative; width: 100%; aspect-ratio: 2/3; border-radius: var(--radius-card); overflow: hidden; background: var(--surface); border: 1px solid var(--line); transition: border-color 0.2s ease, box-shadow 0.2s ease; }
.card-media img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.35s ease; }
.card-badge { position: absolute; top: 10px; right: 10px; background: var(--red); color: #fff; font-size: 0.68rem; font-weight: 700; padding: 4px 11px; border-radius: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
.card-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.35); opacity: 0; transition: opacity 0.2s ease; }
.card-play svg { width: 46px; height: 46px; fill: #fff; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6)); transform: scale(0.85); transition: transform 0.2s ease; }
.card-body { padding: 10px 2px 0; }
.card-body h3 { margin: 0 0 3px; font-family: var(--font-display); font-weight: 700; font-size: 0.92rem; text-align: center; color: var(--text); }
.card-body p { margin: 0; font-size: 0.76rem; color: var(--text-muted); text-align: center; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.course-card:hover .card-media, .course-card:focus-visible .card-media { border-color: var(--red); box-shadow: var(--shadow-lift), 0 0 0 1px var(--red-glow); }
.course-card:hover .card-media img { transform: scale(1.06); }
.course-card:hover .card-play { opacity: 1; }
.course-card:hover .card-play svg { transform: scale(1); }

/* ---------- حالة عدم وجود كورسات ---------- */
.empty-state { text-align: center; padding: 70px 20px 90px; color: var(--text-muted); }
.empty-state svg { width: 56px; height: 56px; fill: none; stroke: var(--text-muted); stroke-width: 1.4; margin-bottom: 16px; }
.empty-state h2 { font-family: var(--font-display); color: var(--text); font-size: 1.15rem; margin: 0 0 8px; }
.empty-state p { max-width: 420px; margin: 0 auto; font-size: 0.86rem; }
.empty-state code { background: var(--surface); border: 1px solid var(--line); padding: 2px 7px; border-radius: 5px; font-size: 0.8rem; color: var(--red); direction: ltr; display: inline-block; }

/* ---------- التذييل ---------- */
.site-footer { border-top: 1px solid var(--line); padding: 26px 0 34px; text-align: center; }
.site-footer p { margin: 0 0 6px; font-size: 0.78rem; color: var(--text-muted); }
.site-footer .rights-note { max-width: 560px; margin: 0 auto; font-size: 0.72rem; color: var(--text-muted); opacity: 0.7; }
.site-footer .admin-link { display: inline-block; margin-top: 10px; font-size: 0.7rem; color: var(--text-muted); opacity: 0.5; }
.site-footer .admin-link:hover { opacity: 1; color: var(--red); }

/* ============================================================
   صفحة الكورس (course.html)
   ============================================================ */
.back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 0.85rem; padding: 18px 0 0; }
.back-link:hover { color: var(--red); }
.back-link svg { width: 16px; height: 16px; fill: currentColor; }

.course-banner { display: grid; grid-template-columns: 190px 1fr; gap: 26px; padding: 22px 0 8px; align-items: start; }
@media (max-width: 640px) { .course-banner { grid-template-columns: 1fr; } }
.course-banner .banner-img { width: 100%; aspect-ratio: 2/3; border-radius: var(--radius-card); overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.course-banner .banner-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.course-banner h2 { font-family: var(--font-display); font-weight: 900; font-size: 1.5rem; margin: 4px 0 10px; }
.course-banner .banner-desc { color: var(--text-muted); font-size: 0.92rem; max-width: 640px; }
.course-banner .badges { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.course-banner .badges span { font-size: 0.72rem; padding: 4px 12px; border-radius: 5px; border: 1px solid var(--line); color: var(--text-muted); }
.course-banner .badges span:first-child { background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; }

/* قسم المعلومات */
.info-section { margin: 28px 0; }
.info-section h3 { font-family: var(--font-display); font-size: 1rem; margin: 0 0 12px; color: var(--text-muted); font-weight: 700; }
.info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.info-item { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 14px; }
.info-item .label { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px; }
.info-item .value { font-size: 0.88rem; font-weight: 600; }
.info-overview { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px 16px; font-size: 0.88rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.8; }

.player-shell { margin-top: 10px; position: relative; width: 100%; background: #000; border-radius: var(--radius-card); overflow: hidden; box-shadow: var(--shadow-lift); border: 1px solid var(--line); }
.player-shell .now-playing-title { padding: 12px 16px; font-size: 0.86rem; color: var(--text-muted); background: var(--surface); border-top: 1px solid var(--line); }
.player-shell .now-playing-title strong { color: var(--text); font-weight: 600; }

/* أزرار الحلقة السابقة / التالية */
.player-nav { display: flex; gap: 10px; margin-top: 12px; }
.nav-btn {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
  padding: 12px; border-radius: var(--radius-sm); cursor: pointer; font-family: var(--font-body);
  font-weight: 600; font-size: 0.85rem; transition: border-color 0.15s ease, background 0.15s ease;
}
.nav-btn:hover:not(:disabled) { border-color: var(--red); background: rgba(229,32,44,0.08); }
.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.nav-btn svg { width: 16px; height: 16px; fill: currentColor; }

/* تبويبات تجميع الحلقات */
.episode-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 22px 0 14px; }
.episode-tab {
  background: var(--surface); border: 1px solid var(--line); color: var(--text-muted);
  font-size: 0.78rem; font-weight: 600; padding: 7px 14px; border-radius: 999px; cursor: pointer;
  transition: all 0.15s ease; direction: ltr;
}
.episode-tab:hover { border-color: var(--red-dim); color: var(--text); }
.episode-tab.active { background: var(--red); border-color: var(--red); color: #fff; }

.lesson-list { margin: 8px 0 60px; display: flex; flex-direction: column; gap: 10px; }
.lesson-list h3 { font-family: var(--font-display); font-size: 1rem; margin: 0 0 6px; color: var(--text-muted); font-weight: 700; }
.lesson-item { display: flex; align-items: center; gap: 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease; text-align: right; }
.lesson-item:hover { border-color: var(--red-dim); }
.lesson-item.active { border-color: var(--red); background: linear-gradient(90deg, rgba(229,32,44,0.12), transparent); }
.lesson-num { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 0.82rem; color: var(--text-muted); }
.lesson-item.active .lesson-num { background: var(--red); color: #fff; border-color: var(--red); }
.lesson-text { flex: 1; min-width: 0; }
.lesson-text h4 { margin: 0 0 3px; font-size: 0.92rem; font-weight: 600; }
.lesson-text p { margin: 0; font-size: 0.78rem; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lesson-play { flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; }
.lesson-play svg { width: 13px; height: 13px; fill: var(--text-muted); }
.lesson-item.active .lesson-play { background: var(--red); }
.lesson-item.active .lesson-play svg { fill: #fff; }

.course-error { text-align: center; padding: 90px 20px; color: var(--text-muted); }
.course-error h2 { color: var(--text); font-family: var(--font-display); }

@media (prefers-reduced-motion: reduce) {
  .course-card, .card-media img, .lesson-item, .brand-mark { transition: none !important; animation: none !important; }
  .course-card { opacity: 1; transform: none; }
}

/* ============================================================
   مشغّل الفيديو المخصص (player.js)
   ============================================================ */
.hp-video-wrap { position: relative; width: 100%; }
.hp-video-wrap video, .hp-video-wrap iframe { display: block; width: 100%; aspect-ratio: 16/9; border: none; background: #000; }
.hp-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.55); z-index: 5; opacity: 0; transition: opacity 0.2s ease; pointer-events: none; }
.hp-loading.show { opacity: 1; }
.hp-spinner { width: 42px; height: 42px; border: 4px solid rgba(255,255,255,0.2); border-top-color: var(--red); border-radius: 50%; animation: hp-spin 0.8s linear infinite; }
@keyframes hp-spin { to { transform: rotate(360deg); } }
.hp-error { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: rgba(0,0,0,0.9); color: #f0f0f0; text-align: center; padding: 20px; z-index: 6; }
.hp-error svg { width: 36px; height: 36px; fill: var(--red); }
.hp-error p { margin: 0; font-size: 0.82rem; color: #ccc; }
.hp-center-play { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; border-radius: 50%; background: rgba(20,20,20,0.6); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 4; opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.15s ease, background 0.15s ease; }
.hp-center-play.show { opacity: 1; pointer-events: auto; }
.hp-center-play:hover { background: var(--red); transform: translate(-50%,-50%) scale(1.07); }
.hp-center-play svg { width: 26px; height: 26px; fill: #fff; margin-right: -3px; }
.hp-bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; background: linear-gradient(to top, rgba(0,0,0,0.88), rgba(0,0,0,0)); padding-top: 22px; transition: opacity 0.25s ease, transform 0.25s ease; }
.hp-video-wrap.controls-hidden .hp-bottom { opacity: 0; transform: translateY(6px); pointer-events: none; }
.hp-video-wrap.controls-hidden { cursor: none; }
.hp-progress-row { display: flex; align-items: center; gap: 8px; padding: 0 12px; }
.hp-progress-wrap { position: relative; flex: 1; display: flex; align-items: center; }
.hp-progress-bar { width: 100%; -webkit-appearance: none; appearance: none; height: 5px; border-radius: 3px; background: #444; outline: none; cursor: pointer; }
.hp-progress-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--red); cursor: pointer; }
.hp-progress-bar::-moz-range-thumb { width: 13px; height: 13px; border: none; border-radius: 50%; background: var(--red); cursor: pointer; }
.hp-hover-preview { position: absolute; bottom: 16px; transform: translateX(50%); background: #000; color: #fff; font-size: 11px; padding: 3px 7px; border-radius: 5px; direction: ltr; pointer-events: none; opacity: 0; transition: opacity 0.12s ease; white-space: nowrap; }
.hp-hover-preview.show { opacity: 1; }
.hp-time { color: #ccc; font-size: 12px; min-width: 90px; text-align: center; direction: ltr; }
.hp-controls { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px 14px; }
.hp-btn { display: flex; align-items: center; justify-content: center; gap: 4px; background: rgba(255,255,255,0.08); color: #f0f0f0; border: none; border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; transition: background 0.15s ease, transform 0.1s ease; font-family: var(--font-body); }
.hp-btn:hover { background: rgba(255,255,255,0.18); }
.hp-btn:active { transform: scale(0.9); }
.hp-btn.play-pause { background: var(--red); color: #fff; padding: 8px 16px; }
.hp-btn.play-pause:hover { background: #ff2e3b; }
.hp-btn.pulse { animation: hp-pulse 0.28s ease; }
@keyframes hp-pulse { 0% { transform: scale(1); } 40% { transform: scale(0.85); } 100% { transform: scale(1); } }
.hp-btn svg { width: 18px; height: 18px; fill: currentColor; }
.hp-speed { background: rgba(255,255,255,0.08); color: #f0f0f0; border: none; border-radius: 8px; padding: 8px 10px; font-size: 13px; cursor: pointer; font-family: var(--font-body); }
.hp-volume-wrap { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.08); border-radius: 8px; padding: 6px 10px; }
.hp-volume-bar { width: 70px; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 3px; background: #666; outline: none; cursor: pointer; }
.hp-volume-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: var(--red); cursor: pointer; }
.hp-volume-bar::-moz-range-thumb { width: 11px; height: 11px; border: none; border-radius: 50%; background: var(--red); cursor: pointer; }

/* ============================================================
   صفحة الأدمن (admin.html)
   ============================================================ */
.admin-shell { max-width: 880px; margin: 0 auto; padding: 40px 20px 80px; }
.admin-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); padding: 28px; margin-bottom: 20px; }
.admin-card h2 { font-family: var(--font-display); font-size: 1.15rem; margin: 0 0 6px; }
.admin-card .hint { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 18px; line-height: 1.8; }

.field { margin-bottom: 16px; }
.field label { display: block; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
.field input[type="text"], .field input[type="password"], .field input[type="url"], .field textarea, .field select {
  width: 100%; background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
  font-family: var(--font-body); font-size: 0.9rem; padding: 11px 13px; border-radius: var(--radius-sm);
  transition: border-color 0.15s ease;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--red); outline: none; }
.field textarea { min-height: 80px; resize: vertical; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 560px) { .field-row { grid-template-columns: 1fr; } }

.btn-primary, .btn-secondary, .btn-danger {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 11px 22px; border-radius: var(--radius-sm); font-family: var(--font-body);
  font-weight: 700; font-size: 0.86rem; cursor: pointer; border: none; transition: all 0.15s ease;
}
.btn-primary { background: var(--red); color: #fff; }
.btn-primary:hover { background: #ff2e3b; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
.btn-secondary:hover { border-color: var(--red-dim); }
.btn-danger { background: transparent; color: #ff5c5c; border: 1px solid rgba(255,92,92,0.4); }
.btn-danger:hover { background: rgba(255,92,92,0.1); }

.admin-login { max-width: 380px; margin: 90px auto; text-align: center; }
.admin-login .brand-mark { width: 60px; height: 60px; margin: 0 auto 16px; }
.admin-login h2 { font-family: var(--font-display); margin: 0 0 22px; }
.admin-login .field { text-align: right; }
.admin-error { color: #ff5c5c; font-size: 0.82rem; margin-top: 10px; min-height: 18px; }

.admin-topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px; border-bottom: 1px solid var(--line); }
.admin-topbar .brand { gap: 10px; }
.admin-topbar .brand-mark { width: 32px; height: 32px; }
.admin-topbar h1 { font-size: 1.05rem; }

.course-row {
  display: flex; align-items: center; gap: 14px; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 10px;
}
.course-row .thumb { width: 44px; height: 58px; border-radius: 6px; overflow: hidden; background: var(--bg); flex-shrink: 0; border: 1px solid var(--line); }
.course-row .thumb img { width: 100%; height: 100%; object-fit: cover; }
.course-row .info { flex: 1; min-width: 0; }
.course-row .info h4 { margin: 0 0 3px; font-size: 0.92rem; }
.course-row .info p { margin: 0; font-size: 0.76rem; color: var(--text-muted); direction: ltr; text-align: right; }
.status-pill { font-size: 0.68rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; flex-shrink: 0; }
.status-pill.published { background: rgba(47,184,95,0.15); color: var(--green); }
.status-pill.draft { background: rgba(232,163,61,0.15); color: var(--amber); }
.course-row .row-actions { display: flex; gap: 6px; flex-shrink: 0; }

.step-tabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
.step-tab { padding: 10px 18px; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; }
.step-tab.active { color: var(--red); border-color: var(--red); }
.step-panel { display: none; }
.step-panel.active { display: block; }

.video-row { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 12px; }
.video-row-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.video-row-head span { font-weight: 700; font-size: 0.85rem; }
.video-row-actions { display: flex; gap: 6px; }
.video-row-actions button { background: var(--surface); border: 1px solid var(--line); color: var(--text-muted); width: 28px; height: 28px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.video-row-actions button:hover { color: var(--red); border-color: var(--red-dim); }
.video-row-actions button svg { width: 14px; height: 14px; fill: currentColor; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface-2); border: 1px solid var(--line); color: var(--text); padding: 13px 22px; border-radius: var(--radius-sm); font-size: 0.85rem; box-shadow: var(--shadow-lift); z-index: 100; opacity: 0; pointer-events: none; transition: all 0.25s ease; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--green); }
.toast.error { border-color: #ff5c5c; }

.admin-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 90; }
.admin-overlay .box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); padding: 24px; display: flex; align-items: center; gap: 12px; }

.toggle-switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-switch .track { position: absolute; inset: 0; background: var(--line); border-radius: 999px; cursor: pointer; transition: background 0.2s ease; }
.toggle-switch .track::after { content:""; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #fff; top: 3px; right: 3px; transition: transform 0.2s ease; }
.toggle-switch input:checked + .track { background: var(--green); }
.toggle-switch input:checked + .track::after { transform: translateX(-18px); }

.empty-dash { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.86rem; }

</style>
</head>

    <div class="wrap site-header-inner">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 200 200">
          <defs>
            <radialGradient id="bgg" cx="50%" cy="42%" r="65%"><stop offset="0%" stop-color="#1a1a1c"/><stop offset="100%" stop-color="#0c0c0d"/></radialGradient>

            <linearGradient id="flameg" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#ff2e3b" stop-opacity="0"/><stop offset="100%" stop-color="#ff6a52"/></linearGradient>
          </defs>
          <circle cx="100" cy="100" r="98" fill="url(#bgg)" stroke="#e5202c" stroke-width="3"/>

        </div>

      <div class="header-actions">
        <button class="icon-btn" id="themeToggle" title="تبديل الوضع الليلي/النهاري" aria-label="تبديل الوضع">
          <svg class="moon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
          <svg class="sun" viewBox="0 0 24 24"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zm0-5a1 1 0 011 1v2a1 1 0 11-2 0V3a1 1 0 011-1zm0 18a1 1 0 011 1v2a1 1 0 11-2 0v-2a1 1 0 011-1zM4.22 4.22a1 1 0 011.42 0l1.41 1.41a1 1 0 11-1.41 1.41L4.22 5.64a1 1 0 010-1.42zm12.73 12.73a1 1 0 011.41 0l1.41 1.41a1 1 0 01-1.41 1.41l-1.41-1.41a1 1 0 010-1.41zM1 12a1 1 0 011-1h2a1 1 0 110 2H2a1 1 0 01-1-1zm18 0a1 1 0 011-1h2a1 1 0 110 2h-2a1 1 0 01-1-1zM4.22 19.78a1 1 0 010-1.41l1.41-1.41a1 1 0 111.41 1.41l-1.41 1.41a1 1 0 01-1.41 0zM16.95 4.22a1 1 0 010 1.41l-1.41 1.41a1 1 0 11-1.41-1.41l1.41-1.41a1 1 0 011.41 0z"/></svg>
        </button>

<script>
/* لا تعدّل هذا الملف — هذه دالة داخلية يستخدمها كل ملف كورس تلقائيًا */
function registerCourse(id, data) {
  window.__HAKIM_COURSES = window.__HAKIM_COURSES || {};
  window.__HAKIM_COURSES[id] = data;
}

</script>
<script src="courses-list.js"></script>
<script>
/* ============================================================
   app.js — الصفحة الرئيسية
   ============================================================ */

(function () {
  const grid = document.getElementById('grid');
  const searchInput = document.getElementById('searchInput');
  const tabRow = document.getElementById('tabRow');

  let allCourses = [];
  let activeCategory = 'الكل';

  function loadScript(src) {
    return new Promise((resolve) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => resolve(true);
      s.onerror = () => { console.warn('تعذّر تحميل ملف الكورس:', src); resolve(false); };
      document.head.appendChild(s);
    });
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  const PLACEHOLDER_IMG =
    'data:image/svg+xml;utf8,' + encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" width="300" height="400">
      <rect width="300" height="400" fill="#1c222e"/>
      <text x="50%" y="50%" fill="#8b93a7" font-size="16" font-family="sans-serif" text-anchor="middle" dy=".3em">لا توجد صورة</text>
    </svg>`);

  function renderEmptyState() {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <svg viewBox="0 0 24 24"><path d="M4 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2V6z"/></svg>
        <h2>لا توجد كورسات مضافة بعد</h2>
        <p>
          أضف كورسًا من <code>admin.html</code>، أو أنشئ ملف بيانات جديد يدويًا
          وسجّل اسمه في <code>courses-list.js</code>.
        </p>
      </div>`;
    tabRow.style.display = 'none';
  }

  function buildTabs(categories) {
    if (categories.length === 0) { tabRow.style.display = 'none'; return; }
    tabRow.style.display = 'flex';
    const cats = ['الكل', ...categories];
    tabRow.innerHTML = cats.map(cat =>
      `<button class="tab-btn ${cat === activeCategory ? 'active' : ''}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`
    ).join('');
    tabRow.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeCategory = btn.dataset.cat;
        tabRow.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGrid();
      });
    });
  }

  function renderGrid() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = allCourses.filter(({ data }) => {
      const matchesCategory = activeCategory === 'الكل' || data.category === activeCategory;
      const matchesSearch = !q ||
        (data.name || '').toLowerCase().includes(q) ||
        (data.description || '').toLowerCase().includes(q);
      return matchesCategory && matchesSearch;
    });

    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <h2>لا توجد نتائج مطابقة</h2>
          <p>جرّب كلمة بحث أخرى أو اختر تصنيفًا مختلفًا.</p>
        </div>`;
      return;
    }

    grid.innerHTML = filtered.map(({ id, data }, i) => `
      <a class="course-card" href="course.html?id=${encodeURIComponent(id)}" style="animation-delay:${Math.min(i * 0.05, 0.4)}s">
        <div class="card-media">
          <img src="${data.img ? escapeHtml(data.img) : PLACEHOLDER_IMG}"
               alt="${escapeHtml(data.name || '')}"
               onerror="this.onerror=null;this.src='${PLACEHOLDER_IMG}'">
          ${data.category ? `<span class="card-badge">${escapeHtml(data.category)}</span>` : ''}
          <div class="card-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        </div>
        <div class="card-body">
          <h3>${escapeHtml(data.name || 'كورس بدون اسم')}</h3>
          <p>${escapeHtml(data.description || '')}</p>
        </div>
      </a>
    `).join('');
  }

  async function init() {
    const ids = (window.COURSES_LIST || []);
    if (ids.length === 0) { renderEmptyState(); return; }

    await Promise.all(ids.map(id => loadScript(`${id}.js`)));

    allCourses = ids
      .map(id => ({ id, data: (window.__HAKIM_COURSES || {})[id] }))
      .filter(c => !!c.data);

    if (allCourses.length === 0) { renderEmptyState(); return; }

    const categories = [...new Set(allCourses.map(c => c.data.category).filter(Boolean))];
    buildTabs(categories);
    renderGrid();
  }

  searchInput.addEventListener('input', renderGrid);
  init();

  /* ---------- الوضع الليلي / النهاري ---------- */
  const themeToggle = document.getElementById('themeToggle');
  if (themeToggle) {
    themeToggle.addEventListener('click', () => {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (isLight) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('hakim_theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('hakim_theme', 'light');
      }
    });
  }
})();

</script>
</body>
